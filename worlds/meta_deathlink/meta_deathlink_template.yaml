# This file has to be in the Players folder to take effect, keeping the "meta.yaml" name
# A meta file rolls its own set of options first
# The result will then overwrite each player's option in that particular field
# For example, if a meta.yaml death_link true result is rolled for a particular game, every player of that game will have death_link enabled
# There is the special case of null, which ignores that part of the meta.yaml,
# allowing for a chance for that meta to not take effect
meta_description: {{ yaml_dump("DeathLink Meta Yaml") }}

{%- macro range_option(option, option_val) %}
    # You can define additional values between the minimum and maximum values.
    # Minimum value is {{ option.range_start }}
    # Maximum value is {{ option.range_end }}
    {%- set data, notes = dictify_range(option, option_val) %}
    {%- for entry, default in data.items() %}
    {{ entry }}: {{ default }}{% if notes[entry] %} # {{ notes[entry] }}{% endif %}
    {%- endfor -%}
{% endmacro %}

{%- for game, game_options in games.items() %}

{{ yaml_dump(game) }}:
  {%- for option_key, option in game_options.items() %}
  {{ option_key }}:
    {%- set option_val = option.default %}
    {%- if option.__doc__ %}
    # {{ cleandoc(option.__doc__)
        | trim
        | replace('\n', '\n# ')
        | indent(4, first=False)
      }}
    {%- endif -%}

    {%- if option.__doc__ and option.range_start is defined %}
    #
    {%- endif -%}

    {%- if option.range_start is defined and option.range_start is number %}
    {{- range_option(option, option_val) -}}

    {%- elif option.options -%}
    {%- for suboption_option_id, sub_option_name in option.name_lookup.items() %}
    {{ yaml_dump(sub_option_name) }}: {% if suboption_option_id == option_val or sub_option_name == option_val %}50{% else %}0{% endif %}
    {%- endfor -%}
  
    {%- if option.name_lookup[option_val] not in option.options and option_val not in option.options %}
    {{ yaml_dump(option_val) }}: 50
    {%- endif -%}

    {{ "\nnull: 0" | indent(4, first=False) }}

    {%- elif option_val is string %}
    {{ yaml_dump(option_val) }}: 50
    {{ "\nnull: 0" | indent(4, first=False) }}

    {%- elif option_val is iterable and option_val is not mapping %}
    {{ option_val | list }}

    {%- else %}
    {{ yaml_dump(option_val) | indent(4, first=false) }}
    {%- endif -%}
    {{ "\n" }}
  {%- endfor %}
{%- endfor %}
