name: Exploration
description: Crystalis Randomizer 2026 Tournament YAML - Exploration Focus

game: Crystalis
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.
  game:
    Crystalis: 2.0.4 # Version of the world required for this yaml to work as expected.

Crystalis:
  progression_balancing: 50
  accessibility: full
  shuffle_areas: false
  shuffle_houses: true
  randomize_tradeins: true
  unidentified_key_items: true
  randomize_wall_elements: true
  shuffle_goa: false
  randomize_sprite_colors: false
  randomize_wild_warp: false
  story_mode: false
  no_bow_mode: false
  orbs_not_required: true
  thunder_warp: shuffled
  vanilla_dolphin: false
  fake_flight: out_of_logic
  statue_glitch: disabled
  mt_sabre_skip: disabled
  statue_gauntlet_skip: disabled
  sword_charge_glitch: disabled
  trigger_skip: disabled
  rage_skip: disabled
  randomize_background_music: vanilla
  randomize_map_colors: false
  randomize_monster_weaknesses: true
  oops_all_mimics: false
  shuffle_tower_robots: false
  dont_shuffle_mimics: false
  keep_unique_items_and_consumables_separate: false
  decrease_enemy_damage: true
  guarantee_starting_sword: true
  guarantee_refresh: true
  experience_scales_faster: false
  no_community_jokes: false
  battle_magic_not_guaranteed: false
  tink_mode: false
  barrier_not_guaranteed: false
  gas_mask_not_guaranteed: true
  dont_buff_consumables: false
  max_scaling_in_tower: false
  experience_scales_slower: false
  charge_shots_only: false
  blackout: false
  permadeath: false
  death_link: false
  dont_buff_dyna: false
  dont_buff_bonus_items: false
  vanilla_maps: gbc_cave
  vanilla_shops: false
  vanilla_wild_warp: disabled
  vanilla_hud: false
  dont_auto_equip_upgrades: false
  disable_controller_shortcuts: false
  audible_wall_cues: false
